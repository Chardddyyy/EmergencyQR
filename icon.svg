<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Accent -->
  <rect x="56" y="56" width="400" height="400" rx="84" fill="none" stroke="#2dd4bf" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Shield Base (Lucide Shield Silhouette) -->
  <g filter="url(#glow)">
    <path d="M256 428c92-48 132-124 132-202V136L256 84 124 136v90c0 78 40 154 132 202z" 
          fill="none" 
          stroke="url(#shieldGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Medical Cross with QR Finder Centers -->
    <path d="M256 160v136M188 228h136" 
          stroke="#ffffff" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- QR Corner Matrix Accents (Lucide Square Roundings) -->
    <rect x="184" y="156" width="40" height="40" rx="8" fill="none" stroke="#2dd4bf" stroke-width="10"/>
    <rect x="288" y="156" width="40" height="40" rx="8" fill="none" stroke="#2dd4bf" stroke-width="10"/>
    <rect x="184" y="260" width="40" height="40" rx="8" fill="none" stroke="#2dd4bf" stroke-width="10"/>
    <rect x="296" y="268" width="24" height="24" rx="4" fill="#5eead4"/>
    
    <!-- Heart Pulse Rhythm Line (Lucide Activity Pulse) -->
    <path d="M148 344h40l20-32 32 64 36-54 18 22h70" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
